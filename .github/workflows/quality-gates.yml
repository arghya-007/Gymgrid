name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high and critical advisories
        run: npm audit --audit-level=high

      - name: Lint web and mobile
        run: npm run lint

      - name: Type-check shared contracts
        run: npm run typecheck:domain

      - name: Type-check mobile app
        run: npm run typecheck:mobile

      - name: Verify Expo dependency compatibility
        run: npm run doctor:mobile

      - name: Build web portal
        run: npm run build:web

      - name: Export Android, iOS, and web bundles
        working-directory: gymgrid-mobile
        run: npx expo export --platform all --output-dir dist
